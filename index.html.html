<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joseph's Daily Boost</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #ffffff;
      --ink: #202020;
      --muted: #656565;
      --line: #e5e5e5;
      --shadow: #202020;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }
    .widget {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px clamp(16px, 4vw, 40px) 18px;
      text-align: center;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 10px;
      box-shadow: 3px 3px 0 var(--shadow);
    }
    .greeting {
      margin: 0;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .message {
      min-height: 126px;
      margin-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 16px 0;
      overflow-wrap: anywhere;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 4.5vw, 2.6rem);
      font-weight: 500;
      line-height: 1.15;
      text-transform: uppercase;
      text-wrap: balance;
    }
    .encouragement {
      max-width: 650px;
      margin: 0 auto;
      font-size: clamp(.95rem, 2vw, 1.05rem);
      line-height: 1.55;
      color: var(--muted);
      text-wrap: pretty;
    }
    .datetime {
      display: grid;
      gap: 6px;
      padding-top: 12px;
      font-family: ui-monospace, "Courier New", monospace;
    }
    .date {
      display: block;
      color: var(--ink);
      font-size: clamp(1rem, 2.7vw, 1.375rem);
      font-weight: 600;
      line-height: 1.5;
      text-transform: uppercase;
    }
    .clock {
      font-size: clamp(1.25rem, 4vw, 1.7rem);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    [hidden] { display: none !important; }
    .startup-note {
      margin: 16px 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--ink);
      font-size: .85rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    @media (max-width: 480px) {
      .message { min-height: 176px; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #191919;
        --ink: #f4f4f1;
        --muted: #b7b7b4;
        --line: #3b3b3b;
        --shadow: #686868;
      }
    }
  </style>
</head>
<body>
  <main class="widget" aria-label="Daily encouragement, date and time">
    <p class="greeting" id="greeting">Your daily boost</p>
    <div class="datetime" aria-label="Current date and time in Juba, South Sudan">
      <div class="date" id="date">Loading date&hellip;</div>
      <time class="clock" id="clock" role="timer" aria-live="off">Loading time&hellip;</time>
    </div>
    <div class="message" id="message" aria-live="polite" aria-atomic="true">
      <h1 id="headline">Welcome, champ!</h1>
      <p class="encouragement" id="encouragement">One good step at a time.</p>
    </div>
    <p class="startup-note" id="startup-note" role="status">
      The live widget has not started. Download this HTML file and open it in
      Chrome or Edge, or open its published GitHub Pages URL. If this notice
      remains, JavaScript may be blocked or the file may be incomplete.
    </p>
  </main>

  <script>
  (function () {
    "use strict";
    try {

      // CUSTOMISE THESE SETTINGS.
      const NAME = "Joseph";
      const TIME_ZONE = "Africa/Juba"; // Always use Juba, South Sudan time.
      const ROTATION_SEED = "joseph-daily-boost-2026"; // Change only to reshuffle the daily sequence.

      // 30 messages: 8 morning + 8 afternoon + 7 evening + 7 night.
      // Each pair is [headline, supporting message].
      // Show ONE pair per time period: four fixed messages per day.
      const messages = {
        morning: [
          ["Hi, champ!", "Welcome to your office. A fresh start, a clear mind, and a day full of possibilities."],
          ["Rise and shine, handsome!", "Bring your focus, your ideas, and that confidence. Let's make today count."],
          [`You've got this, ${NAME}!`, "Start with one clear priority. One small step can build real momentum."],
          ["Fresh day. Fresh energy.", "Yesterday is done. Today is another chance to create something you're proud of."],
          ["Good to see you, boss!", "Your goals deserve your attention. Take a breath, settle in, and begin."],
          ["Hello, future you!", "Do one thing this morning that your future self will thank you for."],
          ["Your ideas belong here.", "Trust your voice. Stay curious. Something great can start with your next idea."],
          [`Let's go, Mr. ${NAME}!`, "You don't need a perfect start. You just need to take the first step."]
        ],
        afternoon: [
          ["Heyy handsome!", "You're going to kill it today. Refocus, reset, and give the next task your best."],
          ["Keep going, champ!", "You don't have to finish everything at once. Just focus on the next useful step."],
          ["Look at you showing up!", "That effort counts, even when progress feels quiet. Keep building."],
          ["You've still got time.", "A slow start does not decide your whole day. Your next move matters."],
          ["Water, stretch, reset.", "Take a little care of yourself, then come back with a clearer head."],
          [`Steady wins, Mr. ${NAME}.`, "Keep your standards high and your self-talk kind. You're learning as you go."],
          ["Make room for one win.", "Choose one meaningful task, give it your attention, and celebrate finishing it."],
          ["Back yourself, handsome!", "You bring something valuable to this work. Let your next action show it."]
        ],
        evening: [
          [`Mr. ${NAME}!`, "I admire your work. Fadal, and let's go!!"],
          ["You showed up today.", "Give yourself credit for the effort, the decisions, and the little wins."],
          ["One calm step at a time.", "If you're still working, choose what matters most and let the rest wait."],
          ["Evening, champ!", "Wrap up with intention. A thoughtful finish can make tomorrow feel lighter."],
          ["Be proud of your progress.", "Big things are built through ordinary days like this one. Your effort matters."],
          ["You've earned a breather.", "Unclench your shoulders, take a slow breath, and enjoy how far you've come."],
          ["Finish gently, handsome.", "Leave one clear note for tomorrow. You don't have to carry every task into tonight."]
        ],
        night: [
          ["Rest well, champ!", "Your worth is bigger than your to-do list. Let today be enough."],
          [`Switch off, Mr. ${NAME}.`, "You can care about your goals and still make time to rest."],
          ["Easy now, handsome.", "Take a deep breath. The next chapter can wait until you've had some sleep."],
          ["Tomorrow is a fresh page.", "Set down what you couldn't finish today. You get to begin again."],
          ["Be kind to yourself.", "You did what you could with the energy you had. That deserves compassion."],
          ["Rest is part of progress.", "Recharge your mind. Great ideas need breathing room, too."],
          [`Sleep peacefully, ${NAME}.`, "Leave yourself one kind thought tonight: I'm learning, I'm growing, and I'm enough."]
        ]
      };

      const greetings = {
        morning: "Good morning",
        afternoon: "Good afternoon",
        evening: "Good evening",
        night: "Good night"
      };

      // Day periods: 05:00 / 12:00 / 17:00 / 21:00.
      function getPeriod(hour) {
        if (hour >= 5 && hour < 12) return "morning";
        if (hour >= 12 && hour < 17) return "afternoon";
        if (hour >= 17 && hour < 21) return "evening";
        return "night";
      }

      const el = {};
      ["greeting", "message", "headline", "encouragement", "date", "clock"].forEach(id => {
        el[id] = document.getElementById(id);
      });
      const zone = TIME_ZONE ? { timeZone: TIME_ZONE } : {};
      const calendarFormat = new Intl.DateTimeFormat("en-GB", {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", hourCycle: "h23", ...zone
      });
      const dateFormat = new Intl.DateTimeFormat("en-US", {
        weekday: "long", month: "long", day: "numeric", year: "numeric", ...zone
      });
      const clockFormat = new Intl.DateTimeFormat("en-US", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true, ...zone
      });
      const reducedMotion = typeof window.matchMedia === "function"
        ? window.matchMedia("(prefers-reduced-motion: reduce)")
        : { matches: true };
      let activeMessageKey = "";
      let animation;

      // Build a shuffled order for each time period, using a fixed seed.
      // The Juba date selects the position in each order, so reopening,
      // refreshing or using a different device keeps the same daily message.
      // Each period uses every message in its list before looping.
      function shuffledOrder(period) {
        const order = messages[period].map((_, index) => index);
        const key = ROTATION_SEED + "|" + period;
        let seed = 2166136261;
        for (let i = 0; i < key.length; i++) {
          seed = Math.imul(seed ^ key.charCodeAt(i), 16777619);
        }
        function random() {
          seed = (seed + 0x6D2B79F5) | 0;
          let value = Math.imul(seed ^ (seed >>> 15), seed | 1);
          value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
          return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
        }
        for (let i = order.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
        return order;
      }
      const dailyOrder = {};
      Object.keys(messages).forEach(period => {
        dailyOrder[period] = shuffledOrder(period);
      });

      function renderMessage(period, index, animate) {
        const list = messages[period];
        el.greeting.textContent = greetings[period];
        el.headline.textContent = list[index][0];
        el.encouragement.textContent = list[index][1];
        if (animation) animation.cancel();
        if (animate && !reducedMotion.matches && el.message.animate) {
          animation = el.message.animate(
            [{ opacity: 0, transform: "translateY(5px)" }, { opacity: 1, transform: "translateY(0)" }],
            { duration: 400, easing: "ease-out" }
          );
        }
      }

      function update() {
        const now = new Date();
        const parts = {};
        calendarFormat.formatToParts(now).forEach(part => {
          if (part.type !== "literal") parts[part.type] = Number(part.value);
        });
        const period = getPeriod(parts.hour);
        el.date.textContent = dateFormat.format(now);
        el.clock.textContent = clockFormat.format(now);
        el.clock.dateTime = now.toISOString();

        // A message day runs from 5am until 4:59am the following morning.
        // Keep the same night message across midnight; only the date changes.
        const calendarDay = Math.floor(Date.UTC(parts.year, parts.month - 1, parts.day) / 86400000);
        const messageDay = calendarDay - (parts.hour < 5 ? 1 : 0);
        const messageKey = messageDay + "|" + period;
        if (messageKey !== activeMessageKey) {
          const order = dailyOrder[period];
          const position = ((messageDay % order.length) + order.length) % order.length;
          renderMessage(period, order[position], activeMessageKey !== "");
          activeMessageKey = messageKey;
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) update();
      });

      update();
      setInterval(update, 1000); // Tick the clock; change words only at period boundaries.
      document.getElementById("startup-note").hidden = true;
    } catch (error) {
      const notice = document.getElementById("startup-note");
      notice.hidden = false;
      notice.textContent = "The widget could not start: " + error.message +
        ". Open the complete HTML file in Chrome or Edge, or check the published GitHub Pages URL.";
      if (window.console) window.console.error("Daily Boost startup error:", error);
    }
  }());
  </script>
</body>
</html>
