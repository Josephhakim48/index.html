<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joseph's Daily Boost</title>

  <style>
    :root {
      color-scheme: light dark;
      --paper: #ffffff;
      --ink: #202020;
      --muted: #656565;
      --line: #e5e5e5;
      --hover: #f3f3f3;
      --shadow: #202020;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .widget {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px clamp(16px, 4vw, 40px) 18px;
      text-align: center;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 10px;
      box-shadow: 3px 3px 0 var(--shadow);
    }

    .greeting {
      margin: 0;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .message {
      min-height: 126px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 16px 0;
      overflow-wrap: anywhere;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 4.5vw, 2.6rem);
      font-weight: 500;
      line-height: 1.15;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .encouragement {
      max-width: 650px;
      margin: 0 auto;
      font-size: clamp(.95rem, 2vw, 1.05rem);
      line-height: 1.55;
      color: var(--muted);
      text-wrap: pretty;
    }

    .datetime {
      display: grid;
      gap: 6px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      font-family: ui-monospace, "Courier New", monospace;
    }

    .date {
      font-size: clamp(.75rem, 2vw, .9rem);
      line-height: 1.5;
    }

    .clock {
      font-size: clamp(1.25rem, 4vw, 1.7rem);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 34px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: .75rem;
      cursor: pointer;
    }

    button:hover {
      background: var(--hover);
      border-color: var(--muted);
    }

    button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .count {
      min-width: 54px;
      font: .7rem ui-monospace, "Courier New", monospace;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    noscript {
      display: block;
      margin: 20px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .message { min-height: 176px; }
    }

    /* Follows your device's light/dark preference. */
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #191919;
        --ink: #f4f4f1;
        --muted: #b7b7b4;
        --line: #3b3b3b;
        --hover: #292929;
        --shadow: #686868;
      }
    }
  </style>
</head>

<body>
  <main class="widget" aria-label="Daily encouragement, date and time">
    <p class="greeting" id="greeting">Your daily boost</p>

    <div class="message" id="message"
         aria-live="polite" aria-atomic="true">
      <h1 id="headline">Welcome, champ!</h1>
      <p class="encouragement" id="encouragement">
        One good step at a time.
      </p>
    </div>

    <div class="datetime">
      <div class="date" id="date"></div>
      <time class="clock" id="clock"
            role="timer" aria-live="off"></time>
    </div>

    <div class="controls" role="group" aria-label="Message controls">
      <button id="pause" type="button" aria-pressed="false">
        Pause
      </button>
      <span class="count" id="count" aria-live="off"></span>
      <button id="next" type="button">
        Next message &rarr;
      </button>
    </div>
  </main>

  <noscript>
    Please enable JavaScript to see your live clock and rotating messages.
  </noscript>

  <script>
    "use strict";

    // ==========================================
    // CUSTOMISE THESE THREE SETTINGS
    // ==========================================

    const NAME = "Joseph";

    // Milliseconds: 15000 = 15 seconds.
    const CHANGE_EVERY = 15000;

    // Blank = your device's local timezone.
    // To fix a timezone, use an IANA name such as "Africa/Juba".
    const TIME_ZONE = "Africa/Juba";

    // ==========================================
    // 30 MESSAGES
    // Each pair: [headline, supporting message]
    // ==========================================

    const messages = {
      morning: [
        [
          "Hi, champ!",
          "Welcome to your office. A fresh start, a clear mind, and a day full of possibilities."
        ],
        [
          "Rise and shine, handsome!",
          "Bring your focus, your ideas, and that confidence. Let's make today count."
        ],
        [
          `You've got this, ${LOGORONYO}!`,
          "Start with one clear priority. One small step can build real momentum."
        ],
        [
          "Fresh day. Fresh energy.",
          "Yesterday is done. Today is another chance to create something you're proud of."
        ],
        [
          "Good to see you, boss!",
          "Your goals deserve your attention. Take a breath, settle in, and begin."
        ],
        [
          "Hello, future you!",
          "Do one thing this morning that your future self will thank you for."
        ],
        [
          "Your ideas belong here.",
          "Trust your voice. Stay curious. Something great can start with your next idea."
        ],
        [
          `Let's go, Mr. ${JOSEPH}!`,
          "You don't need a perfect start. You just need to take the first step."
        ]
      ],

      afternoon: [
        [
          "Heyy handsome!, yuor a STAR",
          "You're going to kill it today. Refocus, reset, and give the next task your best."
        ],
        [
          "Keep going, champ!",
          "You don't have to finish everything at once. Just focus on the next useful step."
        ],
        [
          "Look at you showing up!",
          "That effort counts, even when progress feels quiet. Keep building."
        ],
        [
          "You've still got time.",
          "A slow start does not decide your whole day. Your next move matters."
        ],
        [
          "Water, stretch, reset.",
          "Take a little care of yourself, then come back with a clearer head."
        ],
        [
          `Steady wins, Mr. ${PHENOMANOL}.`,
          "Keep your standards high and your self-talk kind. You're learning as you go."
        ],
        [
          "Make room for one win.",
          "Choose one meaningful task, give it your attention, and celebrate finishing it."
        ],
        [
          "Back yourself, handsome!",
          "You bring something valuable to this work. Let your next action show it."
        ]
      ],

      evening: [
        [
          `Mr. ${RAMBASON}!`,
          "I admire your work. Fadal, and let's go!!"
        ],
        [
          "You showed up today.",
          "Give yourself credit for the effort, the decisions, and the little wins."
        ],
        [
          "One calm step at a time.",
          "If you're still working, choose what matters most and let the rest wait."
        ],
        [
          "Evening, champ!",
          "Wrap up with intention. A thoughtful finish can make tomorrow feel lighter."
        ],
        [
          "Be proud of your progress.",
          "Big things are built through ordinary days like this one. Your effort matters."
        ],
        [
          "You've earned a breather.",
          "Unclench your shoulders, take a slow breath, and enjoy how far you've come."
        ],
        [
          "Finish gently, handsome.",
          "Leave one clear note for tomorrow. You don't have to carry every task into tonight."
        ]
      ],

      night: [
        [
          "Rest well, CHAMP!",
          "Your worth is bigger than your to-do list. Let today be enough."
        ],
        [
          `Switch off, Mr. ${JOSEPH}.`,
          "You can care about your goals and still make time to rest."
        ],
        [
          "Easy now, handsome.",
          "Take a deep breath. The next chapter can wait until you've had some sleep."
        ],
        [
          "Tomorrow is a fresh page.",
          "Set down what you couldn't finish today. You get to begin again."
        ],
        [
          "Be kind to yourself, KING!.",
          "You did what you could with the energy you had. That deserves compassion."
        ],
        [
          "Rest is part of progress.",
          "Recharge your mind. Great ideas need breathing room, too."
        ],
        [
          `Sleep peacefully, ${JOSEPH ABBAS RAMABA}.`,
          "Leave yourself one kind thought tonight: I'm learning, I'm growing, and I'm enough."
        ]
      ]
    };

    const greetings = {
      morning: "Good morning",
      afternoon: "Good afternoon",
      evening: "Good evening",
      night: "Good night"
    };

    // Change these hours if you prefer different time periods.
    function getPeriod(hour) {
      if (hour >= 5 && hour < 12) return "morning";
      if (hour >= 12 && hour < 17) return "afternoon";
      if (hour >= 17 && hour < 21) return "evening";
      return "night";
    }

    const el = Object.fromEntries(
      [
        "greeting", "message", "headline", "encouragement",
        "date", "clock", "pause", "count", "next"
      ].map(id => [id, document.getElementById(id)])
    );

    const zone = TIME_ZONE ? { timeZone: TIME_ZONE } : {};

    const hourFormat = new Intl.DateTimeFormat("en-GB", {
      hour: "2-digit",
      hourCycle: "h23",
      ...zone
    });

    const dateFormat = new Intl.DateTimeFormat("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric",
      ...zone
    });

    const clockFormat = new Intl.DateTimeFormat("en-US", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: true,
      ...zone
    });

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    let period = "";
    let index = 0;
    let paused = false;
    let nextChange = 0;
    let animation;

    function renderMessage(animate = true) {
      const list = messages[period];

      el.greeting.textContent = greetings[period];
      el.headline.textContent = list[index][0];
      el.encouragement.textContent = list[index][1];

      el.count.textContent =
        `${String(index + 1).padStart(2, "0")} / ` +
        `${String(list.length).padStart(2, "0")}`;

      el.count.setAttribute(
        "aria-label",
        `Message ${index + 1} of ${list.length}`
      );

      if (animation) animation.cancel();

      if (animate && !reducedMotion.matches && el.message.animate) {
        animation = el.message.animate(
          [
            { opacity: 0, transform: "translateY(5px)" },
            { opacity: 1, transform: "translateY(0)" }
          ],
          { duration: 400, easing: "ease-out" }
        );
      }
    }

    function nextMessage() {
      index = (index + 1) % messages[period].length;
      renderMessage();
      nextChange = performance.now() + CHANGE_EVERY;
    }

    function update() {
      const now = new Date();
      const newPeriod = getPeriod(Number(hourFormat.format(now)));

      el.date.textContent = dateFormat.format(now);
      el.clock.textContent = clockFormat.format(now);
      el.clock.dateTime = now.toISOString();

      // Switch to the correct time period automatically.
      // This still happens while message rotation is paused.
      if (newPeriod !== period) {
        period = newPeriod;
        index = 0;
        renderMessage(false);
        nextChange = performance.now() + CHANGE_EVERY;
      } else if (
        !paused &&
        !document.hidden &&
        performance.now() >= nextChange
      ) {
        nextMessage();
      }
    }

    el.pause.addEventListener("click", () => {
      paused = !paused;
      el.pause.textContent = paused ? "Resume" : "Pause";
      el.pause.setAttribute("aria-pressed", String(paused));
      nextChange = performance.now() + CHANGE_EVERY;
    });

    el.next.addEventListener("click", () => {
      nextChange = performance.now() + CHANGE_EVERY;
      update();
      nextMessage();
    });

    // Give the current message a full reading interval
    // when you return to the tab.
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        nextChange = performance.now() + CHANGE_EVERY;
        update();
      }
    });

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
